<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Christina Volodina, full-stack web developer">
  <defs>
    <!-- pink chrome: bright sky on top, a dark reflected horizon in the middle, hot pink below -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#ffb4ea"/>
      <stop offset="0.3" stop-color="#ff2fb2"/>
      <stop offset="0.44" stop-color="#6d0a49"/>
      <stop offset="0.47" stop-color="#3f052b"/>
      <stop offset="0.475" stop-color="#ff9be0"/>
      <stop offset="0.6" stop-color="#ff4fbd"/>
      <stop offset="0.74" stop-color="#c2128a"/>
      <stop offset="0.86" stop-color="#ffd6f0"/>
      <stop offset="0.93" stop-color="#ff5cc4"/>
      <stop offset="1" stop-color="#ff8ee0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2bb0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#b3187f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2bb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- water: a slowly drifting surface that bends the light -->
    <filter id="water" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="4" result="n">
        <animate attributeName="baseFrequency" dur="14s" repeatCount="indefinite" values="0.006 0.018;0.009 0.024;0.006 0.018"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="caustic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.022" numOctaves="3" seed="9">
        <animate attributeName="baseFrequency" dur="18s" repeatCount="indefinite" values="0.004 0.022;0.007 0.03;0.004 0.022"/>
      </feTurbulence>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.55  0 0 0 0 0.75  0 0 0 1.6 -0.62"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="dropclip"><path id="shape" d="M1040 92c34 0 62 30 62 70 0 46-30 84-66 84-38 0-66-32-66-74 0-44 34-80 70-80z"/></clipPath>
  </defs>

  <rect width="1280" height="340" fill="#0a0a0b"/>
  <!-- shimmering water surface -->
  <rect width="1280" height="340" filter="url(#caustic)" opacity="0.32"/>

  <!-- ripples spreading from the drop -->
  <g fill="none" stroke="#9fb4d6" stroke-width="1.6">
    <circle cx="1040" cy="176" r="60"><animate attributeName="r" values="60;470" dur="9s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.55;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="176" r="60"><animate attributeName="r" values="60;470" dur="9s" begin="2.25s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.55;0" dur="9s" begin="2.25s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="176" r="60"><animate attributeName="r" values="60;470" dur="9s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.55;0" dur="9s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="176" r="60"><animate attributeName="r" values="60;470" dur="9s" begin="6.75s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.55;0" dur="9s" begin="6.75s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1040" cy="176" r="200" fill="url(#glow)"><animate attributeName="r" values="185;225;185" dur="5s" repeatCount="indefinite"/></circle>

  <!-- the drop: liquid pink chrome, floating and changing shape -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 14 -18; -10 -6; -16 14; 8 10; 0 0" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.2;0.45;0.7;0.9;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0 1040 170; 7 1040 170; -5 1040 170; 0 1040 170" dur="9s" repeatCount="indefinite"/>
    <!-- reflected pink light below it -->
    <ellipse cx="1040" cy="276" rx="70" ry="10" fill="#ff2fb2" opacity="0.45" filter="url(#soft)"/>
    <path fill="url(#chrome)" d="M1040 92c34 0 62 30 62 70 0 46-30 84-66 84-38 0-66-32-66-74 0-44 34-80 70-80z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
        values="M1040 92c34 0 62 30 62 70 0 46-30 84-66 84-38 0-66-32-66-74 0-44 34-80 70-80z;
                M1042 88c38 2 66 34 60 76-5 44-34 82-70 80-38-2-64-36-62-76 3-44 36-82 72-80z;
                M1038 96c32-4 66 26 64 68-2 48-34 82-68 82-40 0-68-34-64-76 3-42 30-70 68-74z;
                M1040 92c34 0 62 30 62 70 0 46-30 84-66 84-38 0-66-32-66-74 0-44 34-80 70-80z"/>
    </path>
    <!-- chrome reflections: a bright window, a curved dark band, a hot spot -->
    <path d="M1000 116c20-24 52-30 80-14-8 20-24 30-44 32-14 2-28-6-36-18z" fill="#ffffff" opacity="0.92" filter="url(#bloom)">
      <animate attributeName="opacity" values="0.92;0.6;0.92" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1062 128c10 14 14 32 8 52" fill="none" stroke="#fff4fb" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="1076" cy="150" rx="9" ry="16" fill="url(#spec)" opacity="0.9"/>
  </g>

  <!-- the name, seen through the water -->
  <g filter="url(#water)">
    <text x="72" y="110" fill="#8d8d93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4">PORTFOLIO · VOLODINA.DE</text>
    <text x="68" y="196" fill="#f4f4f0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">Christina Volodina</text>
    <text x="72" y="256" fill="#f4f4f0" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="400">full-stack web developer</text>
    <text x="72" y="304" fill="#ff5cc4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3">NEXT.JS  ·  REACT  ·  TYPESCRIPT  ·  REMOTE WORLDWIDE</text>
  </g>
</svg>
